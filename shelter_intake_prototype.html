<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Intake — Long-Stay Screening</title>
<style>
  /* ---------- Design tokens ----------
     Palette: a calm records-software workstation. Ink & slate carry everything;
     amber is spent ONLY on the flag — the single place color earns attention.
     Honesty-by-design: the flag is a quiet marker, never a red alarm. */
  :root{
    --paper:#f3f4f2;        /* app background — warm neutral grey, not white */
    --panel:#fbfcfb;        /* raised surfaces */
    --ink:#1e2528;          /* primary text */
    --slate:#5b6870;        /* secondary text */
    --slate-2:#8a959c;      /* tertiary / captions */
    --line:#dde1de;         /* hairlines */
    --line-2:#e8ebe8;
    --field:#ffffff;
    --field-line:#c9d0cd;
    --focus:#2f5b6b;        /* muted teal — interactive accent, NOT the flag */
    --focus-soft:#e4eef1;
    --amber:#b5761d;        /* the flag. warm, serious, not red */
    --amber-bg:#f7ecd8;
    --amber-line:#e4c98f;
    --sel:#eef2f1;          /* selected row */
    --radius:3px;
    --mono:"SFMono-Regular",ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
    --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    font-family:var(--sans);
    background:var(--paper);
    color:var(--ink);
    font-size:14px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  /* ---------- App frame ---------- */
  .app{display:flex;flex-direction:column;height:100vh;}
  .topbar{
    display:flex;align-items:baseline;gap:16px;
    padding:12px 20px;
    background:var(--panel);
    border-bottom:1px solid var(--line);
    flex:0 0 auto;
  }
  .wordmark{
    font-weight:650;letter-spacing:-0.01em;font-size:15px;
  }
  .wordmark .sub{color:var(--slate-2);font-weight:450;margin-left:8px;font-size:13px;letter-spacing:0;}
  .topbar .spacer{flex:1;}
  .species-switch{display:flex;gap:2px;background:var(--line-2);padding:2px;border-radius:var(--radius);}
  .species-switch button{
    font-family:var(--sans);font-size:13px;font-weight:500;
    border:0;background:transparent;color:var(--slate);
    padding:4px 14px;border-radius:2px;cursor:pointer;
  }
  .species-switch button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06);}
  .species-switch button:focus-visible{outline:2px solid var(--focus);outline-offset:1px;}

  /* ---------- Two-pane body ---------- */
  .body{display:flex;flex:1;min-height:0;}
  .queue{
    flex:0 0 380px;
    border-right:1px solid var(--line);
    background:var(--panel);
    display:flex;flex-direction:column;min-height:0;
  }
  .queue-head{
    padding:14px 18px 10px;border-bottom:1px solid var(--line-2);flex:0 0 auto;
  }
  .queue-head h2{margin:0;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--slate);}
  .queue-head .meta{font-size:12px;color:var(--slate-2);margin-top:3px;}
  .queue-head .flagkey{
    display:inline-flex;align-items:center;gap:6px;margin-top:8px;
    font-size:11.5px;color:var(--slate);
  }
  .queue-list{overflow-y:auto;flex:1;}
  .qrow{
    display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:center;
    padding:10px 18px;border-bottom:1px solid var(--line-2);cursor:pointer;
    width:100%;text-align:left;border-left:0;border-right:0;border-top:0;background:transparent;
    font-family:var(--sans);
  }
  .qrow:hover{background:var(--sel);}
  .qrow[aria-selected="true"]{background:var(--sel);box-shadow:inset 3px 0 0 var(--focus);}
  .qrow:focus-visible{outline:2px solid var(--focus);outline-offset:-2px;}
  .qrow .flagdot{width:8px;height:8px;border-radius:50%;background:transparent;}
  .qrow.flagged .flagdot{background:var(--amber);}
  .qrow .who{min-width:0;}
  .qrow .name{font-weight:550;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .qrow .desc{font-size:12px;color:var(--slate-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .qrow .when{font-size:11px;color:var(--slate-2);font-family:var(--mono);white-space:nowrap;}

  /* ---------- Detail pane ---------- */
  .detail{flex:1;overflow-y:auto;min-height:0;padding:22px 28px;}
  .detail-inner{max-width:640px;}
  .detail .empty{color:var(--slate-2);font-size:13.5px;padding-top:40px;max-width:360px;}

  .animal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:4px;}
  .animal-head h1{font-size:22px;margin:0;font-weight:650;letter-spacing:-0.01em;}
  .animal-head .id{font-family:var(--mono);font-size:12px;color:var(--slate-2);margin-top:2px;}

  /* The flag — the signature element. Understated card, amber, human-in-loop copy. */
  .flagcard{
    border:1px solid var(--amber-line);background:var(--amber-bg);
    border-radius:var(--radius);padding:14px 16px;margin:18px 0 22px;
    display:flex;gap:12px;align-items:flex-start;
  }
  .flagcard.noflag{border-color:var(--line);background:var(--panel);}
  .flagcard .mark{
    flex:0 0 auto;width:22px;height:22px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;margin-top:1px;
    background:var(--amber);color:#fff;font-size:13px;font-weight:700;
  }
  .flagcard.noflag .mark{background:var(--slate-2);}
  .flagcard .ftext{min-width:0;}
  .flagcard .ftitle{font-weight:600;font-size:14.5px;}
  .flagcard .fbody{font-size:13px;color:var(--slate);margin-top:3px;}

  .section-label{
    font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;
    color:var(--slate-2);margin:0 0 10px;
  }
  .fields{display:grid;grid-template-columns:1fr 1fr;gap:0 28px;}
  .field{padding:9px 0;border-bottom:1px solid var(--line-2);display:flex;justify-content:space-between;gap:12px;}
  .field .k{color:var(--slate);font-size:13px;}
  .field .v{font-weight:500;font-size:13px;text-align:right;}
  .field .v.muted{color:var(--slate-2);font-weight:400;font-style:italic;}

  /* ---------- Add-intake form ---------- */
  .addbtn{
    font-family:var(--sans);font-size:13px;font-weight:550;
    border:1px solid var(--field-line);background:var(--field);color:var(--ink);
    padding:6px 14px;border-radius:var(--radius);cursor:pointer;
  }
  .addbtn:hover{border-color:var(--focus);}
  .addbtn:focus-visible{outline:2px solid var(--focus);outline-offset:1px;}

  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 22px;margin-top:6px;}
  .form-field{display:flex;flex-direction:column;gap:5px;}
  .form-field.full{grid-column:1 / -1;}
  .form-field label{font-size:12px;font-weight:550;color:var(--slate);}
  .form-field label .hint{font-weight:400;color:var(--slate-2);}
  .form-field select,.form-field input{
    font-family:var(--sans);font-size:13.5px;color:var(--ink);
    background:var(--field);border:1px solid var(--field-line);
    border-radius:var(--radius);padding:8px 10px;width:100%;
  }
  .form-field select:focus,.form-field input:focus{outline:2px solid var(--focus);outline-offset:0;border-color:var(--focus);}
  .radio-row{display:flex;gap:8px;}
  .radio-row button{
    flex:1;font-family:var(--sans);font-size:13px;
    border:1px solid var(--field-line);background:var(--field);color:var(--slate);
    padding:8px;border-radius:var(--radius);cursor:pointer;
  }
  .radio-row button[aria-pressed="true"]{background:var(--focus-soft);border-color:var(--focus);color:var(--ink);font-weight:550;}
  .radio-row button:focus-visible{outline:2px solid var(--focus);outline-offset:1px;}
  .form-actions{display:flex;gap:10px;margin-top:20px;align-items:center;}
  .btn-primary{
    font-family:var(--sans);font-size:13.5px;font-weight:600;
    background:var(--focus);color:#fff;border:0;padding:9px 20px;border-radius:var(--radius);cursor:pointer;
  }
  .btn-primary:hover{background:#264a58;}
  .btn-primary:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
  .btn-ghost{
    font-family:var(--sans);font-size:13.5px;font-weight:500;
    background:transparent;color:var(--slate);border:0;padding:9px 8px;cursor:pointer;
  }
  .form-note{font-size:12px;color:var(--slate-2);margin-top:14px;line-height:1.5;}
  .breadcrumb{font-size:12px;color:var(--slate-2);margin-bottom:14px;}
  .breadcrumb button{background:0;border:0;color:var(--focus);cursor:pointer;font-family:var(--sans);font-size:12px;padding:0;}

  .footnote{
    border-top:1px solid var(--line-2);margin-top:26px;padding-top:14px;
    font-size:11.5px;color:var(--slate-2);line-height:1.55;max-width:600px;
  }
  @media (max-width:820px){
    .body{flex-direction:column;}
    .queue{flex:0 0 auto;max-height:40vh;border-right:0;border-bottom:1px solid var(--line);}
    .fields,.form-grid{grid-template-columns:1fr;}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
</style>
</head>

  <div class="topbar">
    <span class="wordmark">Intake Desk<span class="sub">Long-stay screening</span></span>
    <span class="spacer"></span>
    <div class="species-switch" role="group" aria-label="Species">
      <button id="sp-dog" aria-pressed="true">Dogs</button>
      <button id="sp-cat" aria-pressed="false">Cats</button>
    </div>
  </div>
  <div class="body">

        <div class="meta" id="queue-meta">—</div>

        <div style="margin-top:12px;"><button class="addbtn" id="new-intake-btn">+ New intake</button></div>
      </div>
      <div class="queue-list" id="queue-list" role="listbox" aria-label="Intake queue"></div>
    </aside>
    <main class="detail" id="detail">
      <div class="detail-inner" id="detail-inner">
        <p class="empty">Select an animal from the intake list to view its record, or start a <strong>new intake</strong> to screen an animal as you enter it.</p>
      </div>
    </main>
  </div>
</div>

<script>
// ===== Verified XGBoost port — 0/11207 flag mismatches vs Python =====
const KEEP = new Set(['Normal','Injured','Sick','Nursing','Neonatal']);
function foldHealth(v){ return KEEP.has(v) ? v : 'Other'; }

function buildVector(model, row){
  const fn = model.feature_names;
  const enc = model.encoders;
  const vec = new Array(fn.length).fill(0);
  const cats3 = ['intake_reason','sex','intake_health_condition'];
  const vals = {
    intake_reason: (row.intake_reason==null?'Unknown':row.intake_reason),
    sex: (row.sex==null?'Unknown':row.sex),
    intake_health_condition: foldHealth(row.intake_health_condition==null?'Other':row.intake_health_condition),
  };
  const breedCats = enc['primary_breed'].categories;
  const breedInfreq = new Set(enc['primary_breed'].infrequent||[]);
  let breedRaw = (row.primary_breed==null?'':row.primary_breed);
  let breedCol = (breedCats.includes(breedRaw) && !breedInfreq.has(breedRaw))
      ? 'breed__primary_breed_'+breedRaw
      : 'breed__primary_breed_infrequent_sklearn';
  const num = {
    'num__age_at_intake_days': (row.age_at_intake_days==null||row.age_at_intake_days===''?NaN:Number(row.age_at_intake_days)),
    'num__is_mix': (row.is_mix==null||row.is_mix===''?NaN:Number(row.is_mix)),
    'num__is_previously_spayed_neutered': (row.is_previously_spayed_neutered==null||row.is_previously_spayed_neutered===''?NaN:Number(row.is_previously_spayed_neutered)),
  };
  for (let i=0;i<fn.length;i++){
    const name = fn[i];
    if (name.startsWith('ohe__')){
      const rest = name.slice(5);
      for (const c of cats3){
        if (rest.startsWith(c+'_')){
          if (vals[c]===rest.slice(c.length+1)) vec[i]=1;
          break;
        }
      }
    } else if (name.startsWith('breed__')){
      if (name===breedCol) vec[i]=1;
    } else if (name.startsWith('num__')){
      vec[i]=num[name];
    }
  }
  return vec;
}
function walkTree(node, x){
  while (!('leaf' in node)){
    const fi = parseInt(node.split.slice(1),10);
    const v = x[fi];
    let nxt = (v===null||v===undefined||(typeof v==='number'&&isNaN(v))) ? node.missing
            : ((v < node.split_condition) ? node.yes : node.no);
    let child=null;
    for (const c of node.children){ if (c.nodeid===nxt){ child=c; break; } }
    node=child;
  }
  return node.leaf;
}
function scoreRow(model, row){
  const x = buildVector(model, row);
  let s = model.base_margin;
  for (const t of model.trees){ s += walkTree(t, x); }
  const p = 1/(1+Math.exp(-s));
  return { proba:p, flag: p>=model.threshold };
}

let species = 'Dog';
let selectedId = null;
let mode = 'browse'; // 'browse' | 'detail' | 'form'

const el = (id)=>document.getElementById(id);
const esc = (s)=> (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---------- age formatting ----------
function ageLabel(days){
  if(days==null||isNaN(days)) return 'Unknown';
  days=Number(days);
  if(days<31) return days+ (days===1?' day':' days');
  if(days<365){const m=Math.round(days/30.4); return m+(m===1?' month':' months');}
  const y=days/365; return (y<10? y.toFixed(1): Math.round(y))+' yr';
}
function ynu(v){ if(v==null||v==='') return 'Unknown'; return Number(v)===1?'Yes':'No'; }

// ---------- queue render ----------
function renderQueue(){
  const rows = PAYLOAD.queue[species];
  const flagged = rows.filter(r=>r.flag).length;
  el('queue-meta').textContent = `${rows.length} animals · ${flagged} flagged · intake year 2024`;
  const list = el('queue-list');
  list.innerHTML='';
  rows.forEach(r=>{
    const b=document.createElement('button');
    b.className='qrow'+(r.flag?' flagged':'');
    b.setAttribute('role','option');
    b.setAttribute('aria-selected', String(selectedId===r.animal_id && mode==='detail'));
    const nm = r.name && r.name.trim()? r.name : '(unnamed)';
    const breed = r.primary_breed||'Unknown breed';
    const dt = r.intake_date? r.intake_date.slice(5,10):'';
    b.innerHTML = `<span class="flagdot" aria-hidden="true"></span>
      <span class="who"><span class="name">${esc(nm)}</span><span class="desc">${esc(breed)} · ${esc(ageLabel(r.age_at_intake_days))}</span></span>
      <span class="when">${esc(dt)}</span>`;
    b.addEventListener('click',()=>{ selectedId=r.animal_id; mode='detail'; render(); });
    list.appendChild(b);
  });
}

// ---------- detail render ----------
function renderDetail(){
  const rows = PAYLOAD.queue[species];
  const r = rows.find(x=>x.animal_id===selectedId);
  const inner = el('detail-inner');
  if(!r){ inner.innerHTML='<p class="empty">Select an animal to view its record.</p>'; return; }
  const nm = r.name && r.name.trim()? r.name : '(unnamed)';
  const flagged = r.flag===1;
  const flagBlock = flagged
    ? `<div class="flagcard">
         <div class="mark" aria-hidden="true">!</div>
         <div class="ftext">
           <div class="ftitle">Flagged for early attention</div>
           <div class="fbody">The screening model suggests this animal is worth a closer look early on. It is a prompt to review, not a prediction that the stay will be long — staff decide what happens next.</div>
         </div>
       </div>`
    : `<div class="flagcard noflag">
         <div class="mark" aria-hidden="true">–</div>
         <div class="ftext">
           <div class="ftitle">Not flagged</div>
           <div class="fbody">The model didn't flag this animal. That isn't a guarantee of a short stay — the screen misses some cases — so use normal judgement; it simply wasn't singled out for early review.</div>
         </div>
       </div>`;
  inner.innerHTML = `
    <div class="animal-head">
      <div><h1>${esc(nm)}</h1><div class="id">${esc(r.animal_id)}</div></div>
    </div>
    ${flagBlock}
    <p class="section-label">Intake record</p>
    <div class="fields">
      ${field('Intake reason', r.intake_reason)}
      ${field('Intake date', r.intake_date)}
      ${field('Breed', r.primary_breed)}
      ${field('Mixed', ynu(r.is_mix))}
      ${field('Sex', r.sex)}
      ${field('Age at intake', ageLabel(r.age_at_intake_days))}
      ${field('Health at intake', r.intake_health_condition)}
      ${field('Already spayed/neutered', ynu(r.is_previously_spayed_neutered))}
      ${field('Found location', r.found_location)}
    </div>
    <div class="footnote">
      Screening is based on seven details known at intake (reason, breed, mix, sex, age, intake health, spay/neuter status).
      It is an assistive triage aid, run on 2024 records the model was not trained on. A flag routes attention; it does not decide outcomes or recommend specific actions.
    </div>`;
}
function field(k,v){
  const empty = (v==null||v==='');
  return `<div class="field"><span class="k">${esc(k)}</span><span class="v${empty?' muted':''}">${empty?'—':esc(v)}</span></div>`;
}

          <button type="button" data-v="0" aria-pressed="false">No</button>
          <button type="button" data-v="u" aria-pressed="false">Unknown</button>
        </div>
      </div>
      <div class="form-field"></div>
    </div>
    <div class="form-actions">
      <button class="btn-primary" id="f-run">Run screening</button>
      <button class="btn-ghost" id="f-reset">Clear</button>
    </div>
    <div id="f-result"></div>
    <div class="form-note">
      This screens a hypothetical animal live, in your browser, using the same model that scores the intake list — the seven intake details are all it needs.
      Leaving a field blank is allowed; the model treats it as missing, exactly as it would on a real incomplete record.
    </div>`;

  // wire
  el('back-browse').onclick=()=>{ mode = selectedId? 'detail':'browse'; render(); };
  el('f-reason').onchange=e=>{formState.intake_reason=e.target.value;};
  el('f-sex').onchange=e=>{formState.sex=e.target.value;};
  el('f-breed').onchange=e=>{formState.primary_breed=e.target.value;};
  el('f-health').onchange=e=>{formState.intake_health_condition=e.target.value;};
  el('f-age-y').oninput=e=>{formState.age_years=e.target.value;};
  el('f-age-m').oninput=e=>{formState.age_months=e.target.value;};
  bindRadio('f-mix','is_mix');
  bindRadio('f-sn','is_previously_spayed_neutered');
  el('f-run').onclick=runScreening;
  el('f-reset').onclick=()=>renderForm();
}
function bindRadio(groupId, key){
  const g=el(groupId);
  g.querySelectorAll('button').forEach(btn=>{
    btn.onclick=()=>{
      g.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed','false'));
      btn.setAttribute('aria-pressed','true');
      const v=btn.dataset.v;
      formState[key]= (v==='u')? null : Number(v);
    };
  });
}
function runScreening(){
  // assemble raw row for the scorer
  let breed = formState.primary_breed;
  if(breed==='__other__' || breed==='') breed = 'Other / not listed'; // routes to infrequent bucket
  let ageDays = NaN;
  const y=parseFloat(formState.age_years), m=parseFloat(formState.age_months);
  if(!isNaN(y)||!isNaN(m)) ageDays = (isNaN(y)?0:y)*365 + (isNaN(m)?0:m)*30.4;
  const row = {
    intake_reason: formState.intake_reason||null,
    sex: formState.sex||null,
    intake_health_condition: formState.intake_health_condition||null,
    primary_breed: breed,
    age_at_intake_days: isNaN(ageDays)?null:ageDays,
    is_mix: formState.is_mix,
    is_previously_spayed_neutered: formState.is_previously_spayed_neutered,
  };
  const {flag} = scoreRow(MODELS[species], row);
  const res = el('f-result');
  res.innerHTML = flag
    ? `<div class="flagcard" style="margin-top:20px;">
        <div class="mark" aria-hidden="true">!</div>
        <div class="ftext"><div class="ftitle">Flagged for early attention</div>
        <div class="fbody">On these details, the model singles this animal out for an early closer look. It's a prompt to review, not a verdict — what to do next is the shelter's call.</div></div></div>`
    : `<div class="flagcard noflag" style="margin-top:20px;">
        <div class="mark" aria-hidden="true">–</div>
        <div class="ftext"><div class="ftitle">Not flagged</div>
        <div class="fbody">The model didn't single this animal out. That's not a promise of a short stay — the screen misses some cases — so keep using normal judgement.</div></div></div>`;
}

// ---------- top-level render ----------
function render(){
  renderQueue();
  if(mode==='form'){ renderForm(); }
  else if(mode==='detail'){ renderDetail(); }
  else { el('detail-inner').innerHTML='<p class="empty">Select an animal from the intake list to view its record, or start a <strong>new intake</strong> to screen an animal as you enter it.</p>'; }
}

// ---------- events ----------
el('sp-dog').onclick=()=>switchSpecies('Dog');
el('sp-cat').onclick=()=>switchSpecies('Cat');
function switchSpecies(s){
  if(species===s) return;
  species=s; selectedId=null; if(mode==='detail') mode='browse';
  el('sp-dog').setAttribute('aria-pressed',String(s==='Dog'));
  el('sp-cat').setAttribute('aria-pressed',String(s==='Cat'));
  render();
}
el('new-intake-btn').onclick=()=>{ mode='form'; render(); };

render();
</script>
</body>
</html>
